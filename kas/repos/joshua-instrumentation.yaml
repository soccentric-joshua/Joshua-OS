header:
  version: 14

repos:
  # Joshua-Instrumentation ships its own Yocto layer (yocto/, collection
  # name "instrumentation"), installed via joshua-image.bb. am62axx-evm
  # (Joshua-OS's actual machine) has no descriptor set of its own — added
  # to COMPATIBLE_MACHINE with INSTR_BOARD mapping it to the existing
  # "sitara-am62" descriptors (same SoC family) rather than leaving it
  # unmapped. Instrumentation is meant to be board-independent like
  # WebConfig, not gated on an exact per-board descriptor match.
  joshua-instrumentation:
    url: git@github.com:soccentric-joshua/Joshua-Instrumentation.git
    branch: develop
    path: meta/joshua-instrumentation
    layers:
      yocto:
