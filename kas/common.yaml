header:
  version: 14
  includes:
    - repos/poky.yaml
    - repos/meta-openembedded.yaml
    - repos/meta-arm.yaml
    - repos/meta-ti.yaml
    - repos/meta-swupdate.yaml
    - repos/meta-joshua.yaml

distro: poky
target: joshua-image

local_conf_header:
  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # Joshua-Configuration's committed Cargo.lock (rust-version 1.85,
    # edition2024 crates) needs a Rust toolchain newer than the scarthgap poky
    # default (1.75).  Use the prebuilt 1.85.0 recipes shipped in
    # meta/meta-joshua/recipes-devtools/rust/ instead of building Rust from
    # source.
    PREFERRED_VERSION_rust-native = "1.88.0"
    PREFERRED_VERSION_cargo-native = "1.88.0"
    PREFERRED_VERSION_libstd-rs = "1.88.0"

    # SD card image output
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

    # SWUpdate: enable built-in Mongoose web server and progress IPC
    PACKAGECONFIG:append:pn-swupdate = " webserver"

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # Swupdate specific variables
    SWUPDATE_INIT = "systemd"
