header:
  version: 14
  includes:
    - repos/poky.yaml
    - repos/meta-openembedded.yaml
    - repos/meta-arm.yaml
    - repos/meta-ti.yaml
    - repos/meta-swupdate.yaml
    - repos/meta-joshua.yaml
    - repos/joshua-instrumentation.yaml

distro: poky
target: joshua-image

local_conf_header:
  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # webconfigd talks to systemd over D-Bus via polkit (see its recipe's
    # 50-webconfigd.polkit.rules). polkit is skipped unless this distro
    # feature is enabled.
    DISTRO_FEATURES:append = " polkit"

    # polkit defaults to the mozjs JS engine, whose embedded Rust build targets
    # the OE aarch64-poky-linux-gnu triple. This distro's Rust (libstd-rs 1.88)
    # provides the prebuilt std only for the upstream aarch64-unknown-linux-gnu
    # triple, which mozjs's rustc rejects (E0461 target-triple mismatch). Use
    # the smaller duktape JS engine instead so polkit builds without mozjs.
    PACKAGECONFIG:append:pn-polkit = " duktape"
    PACKAGECONFIG:remove:pn-polkit = " mozjs"

    # Joshua-Configuration's committed Cargo.lock (rust-version 1.85,
    # edition2024 crates) needs a Rust toolchain newer than the scarthgap poky
    # default (1.75).  Use the prebuilt 1.85.0 recipes shipped in
    # meta/meta-joshua/recipes-devtools/rust/ instead of building Rust from
    # source.
    PREFERRED_VERSION_rust-native = "1.88.0"
    PREFERRED_VERSION_cargo-native = "1.88.0"
    PREFERRED_VERSION_libstd-rs = "1.88.0"

    # SD card image output
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

    # SWUpdate: web server/UI intentionally not enabled

    # WebConfig web UI intentionally not installed (removed from all OS builds).

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # Swupdate specific variables
    SWUPDATE_INIT = "systemd"
